<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session checklist</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 8px; font: 15px/1.3 system-ui, Arial, sans-serif; background: #fdf6e3; color: #222; }
  h1 { font-size: 14px; margin: 0 0 6px; color: #8b1a1a; }
  label { display: flex; align-items: center; gap: 10px; padding: 10px 8px; margin-bottom: 6px; background: #fff; border: 1px solid #c9bda0; border-radius: 6px; cursor: pointer; }
  input { width: 22px; height: 22px; flex: none; accent-color: #8b1a1a; }
  label.done { background: #e4efe2; color: #555; }
  label.done span { text-decoration: line-through; }
  #foot { font-size: 11px; color: #777; text-align: center; margin-top: 6px; }
  #foot a { color: #8b1a1a; }
</style></head><body>
<h1 id="title"></h1>
<div id="list"></div>
<div id="foot"><a href="#" id="reset">Untick all</a> &middot; <span id="count"></span></div>
<script>
(function () {
'use strict';
var DEFAULT = [
  'Introduce my names + pronouns',
  'Check level 1 characters have spells and equipment',
  'player etiquette + saftey tools' ,
  'Session rating + content warnings',
  'music and sensory effects',
  'Planned breaks'
];
function param(n) {
  var m = new RegExp('(?:^|[?&#])' + n + '=([^&#]*)').exec((location.search || '') + (location.hash || ''));
  if (!m) return '';
  try { return decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { return m[1]; }
}
var items = param('items') ? param('items').split('|').map(function (s) { return s.trim(); }).filter(Boolean) : DEFAULT;
var name = param('name');
var KEY = 'dnd-checklist:' + (name ? name + '|' : '') + items.join('|');
var state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
document.getElementById('title').textContent = name || 'Before we start';
var box = document.getElementById('list');
function count() {
  var n = items.filter(function (_, i) { return state[i]; }).length;
  document.getElementById('count').textContent = n + ' of ' + items.length + ' done';
}
items.forEach(function (text, i) {
  var l = document.createElement('label'), c = document.createElement('input'), s = document.createElement('span');
  c.type = 'checkbox'; c.checked = !!state[i]; s.textContent = text;
  l.className = c.checked ? 'done' : '';
  c.onchange = function () { state[i] = c.checked; l.className = c.checked ? 'done' : ''; save(); count(); };
  l.appendChild(c); l.appendChild(s); box.appendChild(l);
});
document.getElementById('reset').onclick = function (e) {
  e.preventDefault(); state = {}; save();
  Array.prototype.forEach.call(box.querySelectorAll('label'), function (l) { l.className = ''; l.firstChild.checked = false; });
  count();
};
count();
})();
</script>
</body></html>
