<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encounter</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 12px/1.25 system-ui, Arial, sans-serif; background: #fdf6e3; color: #222; padding-bottom: 56px; -webkit-text-size-adjust: 100%; }
  button { font: inherit; font-size: 13px; min-height: 34px; padding: 2px 8px; border: 1px solid #8b1a1a; background: #fff; color: #8b1a1a; border-radius: 4px; cursor: pointer; touch-action: manipulation; }
  button:active { background: #8b1a1a; color: #fff; }
  input, textarea { font: inherit; font-size: 16px; border: 1px solid #c9bda0; border-radius: 4px; padding: 4px; background: #fff; }
  .sm { font-size: 11px; color: #777; }
  .row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin: 3px 0; }

  #top { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 5px 6px; background: #8b1a1a; color: #fff; }
  #top b { font-size: 14px; margin-right: 4px; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #encName:empty { display: none; }
  #top button { border-color: #fff; background: transparent; color: #fff; min-height: 32px; }
  #top button:active { background: #fff; color: #8b1a1a; }
  #tiers { display: flex; flex: 1 1 210px; }
  #tiers button { flex: 1; border-radius: 0; margin-left: -1px; white-space: nowrap; padding: 2px 4px; }
  #tiers button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  #tiers button:last-child { border-radius: 0 4px 4px 0; }
  #tiers button.on { background: #fff; color: #8b1a1a; font-weight: bold; }
  #tiers .s { display: none; }
  @media (max-width: 640px) { #tiers .f { display: none; } #tiers .s { display: inline; } }
  #foot { text-align: center; padding: 8px 6px 14px; color: #777; font-size: 11px; }
  #foot a { color: #8b1a1a; }

  #groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 6px; padding: 6px; align-items: start; }
  .grp { background: #fff; border: 1px solid #c9bda0; border-radius: 6px; padding: 5px; }
  .gh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .gh b { font-size: 15px; color: #8b1a1a; }
  .gh .ac { font-weight: bold; }
  .sv { display: flex; flex-wrap: wrap; gap: 0 8px; margin: 2px 0; font-size: 12px; color: #555; }
  .sv .ps { color: #222; font-weight: bold; text-decoration: underline; }
  .ma { margin: 3px 0; font-size: 12px; }
  .atk { display: flex; gap: 4px; align-items: center; padding: 2px 0; border-top: 1px dotted #ddd; flex-wrap: wrap; }
  .an { flex: 1 1 90px; min-width: 0; line-height: 1.15; }
  .an b { display: block; }
  .an .sm { display: block; font-size: 10px; }
  .atk .dm { font-weight: bold; }
  .leg { margin: 5px 0 3px; padding: 2px 6px 3px; background: #f7ece6; border-left: 3px solid #8b1a1a; border-radius: 3px; }
  .lh { font-weight: bold; color: #8b1a1a; margin: 2px 0; }
  .lf { padding: 3px 0; border-top: 1px dotted #d9c3bb; font-size: 12px; line-height: 1.25; }
  .lf b { font-size: 13px; }
  .fch { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 2px; }
  .fchip { padding: 4px 8px; border: 1px solid #c9bda0; background: #f6efdc; border-radius: 10px; font-size: 12px; cursor: pointer; }
  .fchip.on { background: #8b1a1a; color: #fff; border-color: #8b1a1a; }
  .fchip i { font-style: normal; font-size: 10px; opacity: .7; margin-left: 3px; }
  .fdesc { margin: 3px 0; padding: 4px 6px; background: #fffbe8; border-left: 3px solid #d4a017; font-size: 12px; display: none; }
  .fdesc.open { display: block; }
  .pq { flex-basis: 100%; display: flex; gap: 3px; flex-wrap: wrap; }
  .pq:empty { display: none; }
  .chip { display: inline-flex; flex-direction: column; align-items: center; cursor: pointer; line-height: 1; }
  .chip svg { display: block; }
  .chip .cap { font-size: 10px; color: #555; margin-top: 1px; }
  .chip.used { opacity: .25; filter: grayscale(1); }
  .tg { display: inline-block; width: 9px; height: 9px; margin-right: 3px; border: 1px solid #888; vertical-align: -1px; }

  .inst { position: relative; display: flex; align-items: center; gap: 6px; padding: 3px 4px; margin: 3px 0; border: 1px solid #c9bda0; border-radius: 5px; overflow: hidden; background: #fff; }
  .inst .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; opacity: .22; z-index: 0; transition: width .12s; }
  .inst > *:not(.fill) { position: relative; z-index: 1; }
  .inst .nm { font-weight: bold; }
  .inst .ib { min-height: 30px; padding: 0 7px; font-size: 12px; white-space: nowrap; }
  .inst .ib.set { background: #8b1a1a; color: #fff; font-weight: bold; }
  .inst .hpv { font-weight: bold; font-size: 16px; white-space: nowrap; }
  .inst input { flex: 1 1 56px; min-width: 56px; width: 100%; min-height: 34px; text-align: center; padding: 2px; }
  .inst.down { opacity: .45; }
  .inst.down .nm { text-decoration: line-through; }

  details.feat { margin-top: 4px; }
  details.feat summary { cursor: pointer; font-weight: bold; color: #8b1a1a; }
  details.feat details { margin: 2px 0 2px 8px; }
  .dcb { background: #ffe8a3; border-radius: 2px; padding: 0 2px; }

  #rollbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: #222; color: #fff; }
  #last { padding: 6px 10px; font-size: 13px; min-height: 40px; cursor: pointer; }
  #last .big { font-size: 20px; font-weight: bold; color: #ffd75e; margin: 0 3px; }
  #last .sm { color: #bbb; }
  #logPanel { display: none; max-height: 40vh; overflow-y: auto; padding: 4px 10px; border-top: 1px solid #444; }
  #logPanel.open { display: block; }
  #logPanel div { padding: 3px 0; border-bottom: 1px dotted #444; }
  #logPanel .big { font-weight: bold; color: #ffd75e; }
  #logPanel .sm { color: #aaa; }
</style>
</head>
<body>

<!-- Optional: bake an encounter into this file. Normally leave both empty: the link carries the encounter. -->
<script>
  var ENCOUNTER_NAME = "";
  var ENCOUNTER = "";
</script>

<div id="top">
  <b id="encName"></b>
  <div id="tiers"></div>
  <button id="btnInitAll">Roll init</button>
</div>

<div id="groups"></div>

<div id="foot"><a href="#" id="lnkReset">Reset HP and init</a> &middot; <a href="setup.html" id="lnkSetup">Setup</a> &middot; Build 15</div>

<div id="rollbar">
  <div id="last">Tap a damage button to roll. Tap here for the log.</div>
  <div id="logPanel"></div>
</div>

<script>
/**
 * Open5e importer: fetches creatures and converts them to the sidebar's own schema.
 * Open5e's structured "attacks" array drops extra damage (e.g. +1d6 poison) and
 * conditional/alternate damage, so we parse the action text (desc) instead.
 */

var OPEN5E = 'https://api.open5e.com/v2/creatures/';
var ABIL_KEYS = { strength: 'str', dexterity: 'dex', constitution: 'con',
                  intelligence: 'int', wisdom: 'wis', charisma: 'cha' };
var ABIL_NAMES = '(Strength|Dexterity|Constitution|Intelligence|Wisdom|Charisma)';

function cleanText(s) {
  return String(s || '').replace(/([A-Za-z]+)\s*\[[^\]]*\]\|[^|\s]*\|\1/g, '$1').replace(/\s*\[[^\]]*\]\|[^|\s]*\|/g, ' ').replace(/\*\*/g, '').replace(/_([^_]+)_/g, '$1')
    .replace(/:\s*\n+\s*[-*]\s+/g, ': ').replace(/\s*\n\s*[-*]\s+/g, ' | ')
    .replace(/\s+/g, ' ').trim();
}

/** Recharge info lives in usage_limits, not in the name. */
function usageSuffix(u) {
  if (!u || !u.type || !/RECHARGE_ON_ROLL/i.test(String(u.type)) || !u.param) return '';
  return ' (Recharge ' + u.param + (+u.param < 6 ? '-6' : '') + ')';
}

function actionLabel(t) {
  var map = { ACTION: 'Action', BONUS_ACTION: 'Bonus action', REACTION: 'Reaction',
              LEGENDARY_ACTION: 'Legendary action', LAIR_ACTION: 'Lair action' };
  return map[t] || 'Action';
}

function uniq(arr) {
  return arr.filter(function (x, i) { return arr.indexOf(x) === i; });
}

/** Returns {attacks: [...], feature: {...} | null} for one Open5e action. */
function parseAction(a) {
  var desc = cleanText(a.desc);
  var out = { attacks: [], feature: null };

  var hit = /(?:Attack Roll|Weapon Attack|Spell Attack)[^:]*:\s*([+-]\d+)/i.exec(desc);
  var s1 = new RegExp(ABIL_NAMES + '\\s+Saving Throw:?\\s*DC\\s*(\\d+)', 'i').exec(desc);
  var s2 = new RegExp('DC\\s*(\\d+)\\s+' + ABIL_NAMES + '\\s+saving throw', 'i').exec(desc);
  var save = s1 ? { ability: s1[1], dc: +s1[2] } : s2 ? { ability: s2[2], dc: +s2[1] } : null;

  var re = /(\d+)\s*\(([^)]+)\)\s*([A-Za-z]+)\s+damage/gi, m;
  var base = [], alt = [], cond = [];
  while ((m = re.exec(desc))) {
    var d = { dice: m[2].replace(/\s+/g, ''), type: m[3].toLowerCase() };
    var before = desc.slice(Math.max(0, m.index - 8), m.index);
    var after = desc.slice(re.lastIndex);
    var cut = after.search(/—|\.\s|\.$|\d+\s*\(/);
    if (cut >= 0) after = after.slice(0, cut);
    if (/(^|[\s—–-])or\s*$/i.test(before)) alt.push(d);        // "...damage—or 12 (2d8+3) ..."
    else if (/\bif\b/i.test(after)) cond.push(d);               // "plus 2 (1d4) ... if the attack roll had Advantage"
    else base.push(d);
  }
  function dice(x) { return x.dice; }
  function part(x) { return { dice: x.dice, type: x.type }; }
  function types(arr) { return uniq(arr.map(function (x) { return x.type; })).join(' + '); }

  /* Rules that aren't damage dice: action-economy tag, who the save targets, "If ..." riders (Prone, Grappled...). */
  function extras() {
    var bits = [];
    if (a.action_type === 'BONUS_ACTION') bits.push('Bonus action');
    else if (a.action_type === 'REACTION') bits.push('Reaction');
    if (hit) {
      var rm = /reach\s*(\d+)\s*ft/i.exec(desc), gm = /range\s*(\d+(?:\/\d+)?)\s*ft/i.exec(desc), rb = [];
      if (rm && +rm[1] !== 5) rb.push('reach ' + rm[1] + ' ft');
      if (gm) rb.push('range ' + gm[1] + ' ft');
      if (rb.length) bits.push(rb.join(', '));
      var am = /\(\s*with (Advantage|Disadvantage) if ([^)]+)\)/i.exec(desc);
      if (am) bits.push(am[1] + ' if ' + am[2]);
    }
    var tm = /DC\s*:?\s*\d+,\s*([^.]*?)\.\s*(?:Failure|Success)/i.exec(desc);
    if (tm && !/-foot|cone|line|emanation|sphere|cylinder|cube/i.test(tm[1])) bits.push('Target: ' + tm[1].trim());
    var fm = /damage,?\s+and\s+([^.]*)\./i.exec(desc);
    if (save && fm) bits.push(fm[1].trim().replace(/^./, function (ch) { return ch.toUpperCase(); }));
    var om = /Failure or Success:\s*([^.]*)\./i.exec(desc);
    if (om) bits.push(om[1].trim().replace(/^./, function (ch) { return ch.toUpperCase(); }));
    desc.split(/(?<=\.)\s+/).forEach(function (s) {
      if (/^If /i.test(s) && !/\d\s*\(\d*d\d/i.test(s)) bits.push(s.replace(/\.$/, ''));
    });
    return bits.join('; ');
  }
  function joinNote(x) { var e = extras(); return [x, e].filter(Boolean).join('; '); }

  if (hit && base.length) {
    var bonus = +hit[1];
    out.attacks.push({
      name: a.name, kind: 'attack', bonus: bonus,
      dmg: base.map(dice).join('+'), type: types(base), parts: base.map(part),
      note: joinNote(cond.map(function (c) { return '+' + c.dice + ' ' + c.type + ' (conditional)'; }).join('; '))
    });
    if (alt.length) {
      var altAll = alt.slice(0, 1).concat(base.slice(1));
      var cm = /—\s*or\s*\d+\s*\([^)]+\)\s*[A-Za-z]+\s+damage\s+(if [^—.]+)/i.exec(desc);
      var condTxt = cm ? cm[1].trim() : '';
      var short = condTxt.replace(/^if\s+(the\s+)?(target|creature)\s+(is|has)\s+/i, 'if ').replace(/\s+by the .*$/i, '');
      var adv = /with Advantage if ([^)]+)\)/i.exec(desc);
      out.attacks.push({
        name: a.name + (short ? ' (' + short + ')' : ' (alt)'), kind: 'attack', bonus: bonus,
        dmg: altAll.map(dice).join('+'), type: types(altAll), parts: altAll.map(part),
        note: condTxt ? 'use ' + condTxt : 'alternate damage, see description'
      });
    }
  } else if (save && (base.length || cond.length)) {
    var dmgs = base.length ? base : cond;
    out.attacks.push({
      name: a.name, kind: 'save', dc: save.dc, ability: save.ability.slice(0, 3),
      bonus: 0, dmg: dmgs.map(dice).join('+'), type: types(dmgs), parts: dmgs.map(part),
      note: joinNote(/half (as much )?damage/i.test(desc) ? 'half damage on success' : '')
    });
  } else {
    out.feature = { name: a.name, kind: actionLabel(a.action_type), desc: desc };
  }
  return out;
}

var NUM_WORDS = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6 };
function numWord(s) {
  s = String(s || '').toLowerCase();
  return /^\d+$/.test(s) ? +s : (NUM_WORDS[s] || null);
}

/** How many legendary actions a creature gets, and which entries only state that rule. */
function findLegendaryIntro(c) {
  var out = { uses: null, lair: null, consumed: [] };
  function read(text) {
    var m = /legendary actions?(?:\s+uses?)?\s*:?\s*(\d+)(?:\s*\(\s*(\d+)\s*in\s+(?:its\s+|the\s+)?lair\s*\))?/i.exec(text);
    if (m) { out.uses = +m[1]; out.lair = m[2] ? +m[2] : null; return true; }
    m = /can take (\w+) legendary actions?/i.exec(text);
    if (m && numWord(m[1])) { out.uses = numWord(m[1]); return true; }
    return false;
  }
  if (c.legendary_desc) read(cleanText(c.legendary_desc));
  (c.actions || []).concat(c.traits || []).forEach(function (e) {
    var name = String(e.name || '').trim();
    var got = read(cleanText(name + ' ' + (e.desc || '')));
    if (/^legendary actions?( uses?)?$/i.test(name) || (got && /legendary action/i.test(name))) out.consumed.push(e);
  });
  return out;
}

function profBonus(cr) {
  var n = +cr || 0;
  return n < 5 ? 2 : n < 9 ? 3 : n < 13 ? 4 : n < 17 ? 5 : n < 21 ? 6 : n < 25 ? 7 : n < 29 ? 8 : 9;
}

function crLabel(cr) {
  var map = { 0.125: '1/8', 0.25: '1/4', 0.5: '1/2' };
  return map[cr] || String(cr);
}

function normalizeCreature(c) {
  var ab = c.ability_scores || {}, abilities = {};
  Object.keys(ABIL_KEYS).forEach(function (k) { abilities[ABIL_KEYS[k]] = ab[k] || 10; });

  var intro = findLegendaryIntro(c);
  var features = (c.traits || []).filter(function (t) { return intro.consumed.indexOf(t) < 0; }).map(function (t) {
    return { name: t.name, kind: 'Trait', desc: cleanText(t.desc) };
  });
  var attacks = [];
  (c.actions || []).forEach(function (a0) {
    if (intro.consumed.indexOf(a0) >= 0) return;
    var leg = a0.action_type === 'LEGENDARY_ACTION';
    var cost = leg && a0.legendary_action_cost > 1 && !/cost/i.test(a0.name || '') ? ' (Costs ' + a0.legendary_action_cost + ')' : '';
    var a = Object.assign({}, a0, { name: a0.name + usageSuffix(a0.usage_limits) + cost });
    var p = parseAction(a), ord = a0.order_in_statblock || 0;
    p.attacks.forEach(function (x) { x.order = ord; if (leg) x.legendary = true; attacks.push(x); });
    if (p.feature) { p.feature.order = ord; if (leg) p.feature.legendary = true; features.push(p.feature); }
  });
  var legAny = attacks.concat(features).some(function (x) { return x.legendary; });
  /* Open5e's JSON has no "Legendary Action Uses" line (its website writes one in itself),
     so fall back to the 2024 standard: 3, or 3 (4 in Lair) when Legendary Resistance mentions a lair. */
  var assumed = false;
  if (legAny && intro.uses === null) {
    var hasLair = (c.traits || []).concat(c.actions || []).some(function (e) { return /legendary resistance[^)]*in lair/i.test(e.name || ''); });
    intro.uses = 3; intro.lair = hasLair ? 4 : null; assumed = true;
  }
  var legendary = (legAny || intro.uses !== null) ? { uses: intro.uses, lair: intro.lair, assumed: assumed } : null;

  var speed = Object.keys(c.speed || {}).filter(function (k) {
    return k !== 'unit' && k !== 'hover' && c.speed[k] > 0;
  }).map(function (k) { return (k === 'walk' ? '' : k + ' ') + c.speed[k] + ' ft.'; }).join(', ');

  var senses = [];
  [['darkvision', c.darkvision_range], ['blindsight', c.blindsight_range],
   ['tremorsense', c.tremorsense_range], ['truesight', c.truesight_range]].forEach(function (s) {
    if (s[1]) senses.push(s[0] + ' ' + s[1] + ' ft.');
  });
  if (c.passive_perception) senses.push('passive Perception ' + c.passive_perception);

  var ri = c.resistances_and_immunities || {}, def = [];
  if (ri.damage_vulnerabilities_display) def.push('Vulnerable: ' + ri.damage_vulnerabilities_display);
  if (ri.damage_resistances_display) def.push('Resist: ' + ri.damage_resistances_display);
  if (ri.damage_immunities_display) def.push('Immune: ' + ri.damage_immunities_display);
  if (ri.condition_immunities_display) def.push('Condition immune: ' + ri.condition_immunities_display);

  var doc = c.document || {};
  var licence = doc.key === 'srd-2024' ? ' (CC BY 4.0)' : '';

  var sv = c.saving_throws || c.modifiers || {}, saves = {};
  Object.keys(ABIL_KEYS).forEach(function (k) {
    saves[ABIL_KEYS[k]] = sv[k] !== undefined && sv[k] !== null ? sv[k] : Math.floor(((ab[k] || 10) - 10) / 2);
  });

  return {
    key: c.key, name: c.name, saves: saves, init: c.initiative_bonus,
    pb: c.proficiency_bonus || profBonus(c.challenge_rating),
    skills: Object.keys(c.skill_bonuses || {}).map(function (k) {
      var nm = k.replace(/_/g, ' ');
      return { name: nm.charAt(0).toUpperCase() + nm.slice(1), bonus: c.skill_bonuses[k] };
    }),
    hp: c.hit_points || 1, maxHp: c.hit_points || 1, hitDice: c.hit_dice || '',
    ac: c.armor_class || 10, speed: speed, abilities: abilities,
    cr: crLabel(c.challenge_rating),
    size: (c.size && c.size.name) || '', type: (c.type && c.type.name) || '',
    alignment: c.alignment || '',
    senses: senses.join(', '), defenses: def.join('; '),
    attacks: attacks, features: features, legendary: legendary, notes: '',
    source: (doc.name || 'Open5e') + ' via Open5e' + licence
  };
}

</script>

<script>
(function () {
'use strict';

var TIER_DEFAULTS = [
  { id: 'l1',  label: 'Level 1',     hp: 60,  dmg: 60,  save: -2, dc: -2, ac: -2, hit: -2 },
  { id: 'low', label: 'Low level',   hp: 80,  dmg: 80,  save: -1, dc: -1, ac: -1, hit: -1 },
  { id: 'std', label: 'Standard',    hp: 100, dmg: 100, save: 0,  dc: 0,  ac: 0, hit: 0 },
  { id: 'exp', label: 'Experienced', hp: 130, dmg: 125, save: 2,  dc: 2,  ac: 2, hit: 2 }
];
var SHORT = { l1: 'Lvl 1', low: 'Low', std: 'Std', exp: 'Exp' };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function sgn(n) { return (n >= 0 ? '+' : '') + n; }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function lsGet(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

/* ---------- encounter string ---------- */
function keyFromRef(ref) {
  ref = ref.trim();
  var m = /\/(?:creatures|monsters)\/([^\/?#]+)/.exec(ref);
  if (m) return m[1];
  if (/^[\w-]+$/.test(ref)) return ref;
  return null;
}
function parseEncounter(s) {
  var out = [];
  String(s || '').split(/[&\n,]+/).forEach(function (part) {
    part = part.trim(); if (!part) return;
    var m = /^(\d+)\s*[xX]\s*(.+)$/.exec(part), n = 1, ref = part;
    if (m) { n = +m[1]; ref = m[2]; }
    try { ref = decodeURIComponent(ref); } catch (e) {}
    var key = keyFromRef(ref);
    if (key) out.push({ key: key, n: Math.max(1, Math.min(n, 20)) });
  });
  return out;
}
function nameParam() {
  var m = /(?:^|[?&#])name=([^&#]*)/.exec((location.search || '') + (location.hash || ''));
  if (!m) return '';
  try { return decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { return m[1]; }
}
function urlEncounter() {
  var raw = (location.search || '').slice(1) || (location.hash || '').slice(1);
  return raw.replace(/^e=/, '');
}

/* ---------- state ---------- */
var tiers = lsGet('dnd-tiers-v2', null);
if (!tiers || tiers.length !== 4) tiers = JSON.parse(JSON.stringify(TIER_DEFAULTS));
tiers.forEach(function (t) {
  var def = TIER_DEFAULTS.filter(function (x) { return x.id === t.id; })[0] || {};
  if (t.ac === undefined) t.ac = def.ac || 0;
  if (t.hit === undefined) t.hit = def.hit || 0;
});
var enc = [], groups = [], SKEY = '', st = { tier: 'std', taken: {}, init: {} };
var logLines = [];

function T() { return tiers.filter(function (t) { return t.id === st.tier; })[0] || tiers[2]; }
function saveSt() { if (SKEY) lsSet(SKEY, st); }
function saveTiers() { lsSet('dnd-tiers-v2', tiers); }
function maxHp(g) { return Math.max(1, Math.round(g.c.maxHp * T().hp / 100)); }
function bumpDC(text) {
  var tt = T(), s = esc(text);
  if (tt.dc) s = s.replace(/\bDC (\d+)/g, function (m, n) { return '<span class="dcb">DC ' + (+n + tt.dc) + '</span>'; });
  if (tt.hit) {
    s = s.replace(/(Attack Roll:\s*)([+-])(\d+)/gi, function (m, pre, sg, n) { return pre + '<span class="dcb">' + sgn((sg === '-' ? -1 : 1) * +n + tt.hit) + '</span>'; });
    s = s.replace(/([+-])(\d+)(?= to hit)/g, function (m, sg, n) { return '<span class="dcb">' + sgn((sg === '-' ? -1 : 1) * +n + tt.hit) + '</span>'; });
  }
  return s;
}

/* ---------- dice ---------- */
function d(n) { return 1 + Math.floor(Math.random() * n); }
function rollExpr(expr) {
  var re = /([+-]?)\s*(?:(\d*)d(\d+)|(\d+))/gi, m, total = 0, parts = [];
  while ((m = re.exec(expr))) {
    var sign = m[1] === '-' ? -1 : 1;
    if (m[3]) {
      var n = (m[2] ? +m[2] : 1), s = +m[3], r = [], sum = 0;
      for (var i = 0; i < n; i++) { var v = d(s); r.push(v); sum += v; }
      total += sign * sum;
      parts.push((sign < 0 ? '-' : '') + n + 'd' + s + '[' + r.join(',') + ']');
    } else { total += sign * (+m[4]); parts.push(sgn(sign * (+m[4]))); }
  }
  return { total: Math.max(0, total), text: parts.join(' ') };
}
var TYPE_COLOR = { bludgeoning: '#d9c7b0', piercing: '#cfd8dc', slashing: '#b0bec5', acid: '#c5e1a5', fire: '#ffcc80', cold: '#b3e5fc',
  lightning: '#fff59d', poison: '#ce93d8', necrotic: '#b39ddb', radiant: '#fff9c4', thunder: '#b2ebf2', force: '#f8bbd0', psychic: '#f48fb1' };
function tcol(ty) { return TYPE_COLOR[ty] || '#e0e0e0'; }
function attackParts(a) {
  if (a.parts && a.parts.length) return a.parts;
  return [{ dice: a.dmg, type: String(a.type || 'damage').split(' + ')[0] }];
}
function partTypes(a) {
  var out = [];
  attackParts(a).forEach(function (p) { if (out.indexOf(p.type) < 0) out.push(p.type); });
  return out.slice(0, 4);
}
/* roll each damage type separately (max 4 shown), scaled by the tier */
function rollParts(a) {
  var pct = T().dmg, groups = [];
  attackParts(a).forEach(function (p) {
    var r = rollExpr(p.dice), amt = Math.max(0, Math.round(r.total * pct / 100));
    var gp = groups.filter(function (x) { return x.type === p.type; })[0];
    if (!gp) { gp = { type: p.type, amt: 0, text: [] }; groups.push(gp); }
    gp.amt += amt; gp.text.push(r.text);
  });
  while (groups.length > 4) { var x = groups.pop(); groups[3].amt += x.amt; groups[3].type += '+' + x.type; groups[3].text.push(x.text.join(' ')); }
  var total = groups.reduce(function (s, x) { return s + x.amt; }, 0);
  return { parts: groups, total: total, text: groups.map(function (x) { return x.text.join(' '); }).join(' | ') + (pct !== 100 ? '  x' + (pct / 100) : '') };
}
function breakdown(r) { return r.parts.length > 1 ? r.parts.map(function (p) { return p.type + ' ' + p.amt; }).join(' + ') : (r.parts[0] ? r.parts[0].type : ''); }
function say(who, what, big, small) {
  var line = '<b>' + esc(who) + '</b> ' + esc(what) + ' <span class="big">' + big + '</span> <span class="sm">' + small + '</span>';
  $('last').innerHTML = line;
  logLines.unshift(line); if (logLines.length > 40) logLines.pop();
  $('logPanel').innerHTML = logLines.map(function (l) { return '<div>' + l + '</div>'; }).join('');
}

/* ---------- loading ---------- */
function getCreature(key) {
  var cached = lsGet('dnd-cr6:' + key, null);
  if (cached) return Promise.resolve(cached);
  return fetch(OPEN5E + encodeURIComponent(key) + '/').then(function (r) {
    if (!r.ok) throw new Error('Open5e returned ' + r.status + ' for ' + key);
    return r.json();
  }).then(function (j) { var c = normalizeCreature(j); lsSet('dnd-cr6:' + key, c); return c; });
}

function start(str) {
  enc = parseEncounter(str);
  var nm = nameParam();
  SKEY = 'dnd-enc-st3:' + (nm ? nm + '|' : '') + enc.map(function (e) { return e.key + 'x' + e.n; }).join('&');
  st = lsGet(SKEY, null) || { tier: 'std', taken: {}, init: {} };
  if (!st.taken) st.taken = {};
  if (!st.init) st.init = {};
  groups = enc.map(function (e, gi) { return { gi: gi, key: e.key, n: e.n, c: null, err: null, insts: [], pre: {} }; });
  renderTop();
  if (!enc.length) {
    var none = el('div', 'grp', 'No encounter in this link. ');
    var na = el('a', '', 'Build one on the setup page'); na.href = 'setup.html';
    none.appendChild(na); $('groups').innerHTML = ''; $('groups').appendChild(none);
    return;
  }
  render();
  Promise.all(groups.map(function (g) {
    return getCreature(g.key).then(function (c) { g.c = c; }).catch(function (e) { g.err = e.message; });
  })).then(function () { render(); });
}

/* ---------- rendering ---------- */
function renderTop() {
  $('encName').textContent = nameParam() || (typeof ENCOUNTER_NAME === 'string' && ENCOUNTER_NAME) || '';
  var box = $('tiers'); box.innerHTML = '';
  tiers.forEach(function (t) {
    var b = el('button', t.id === st.tier ? 'on' : '');
    b.innerHTML = '<span class="f">' + esc(t.label) + '</span><span class="s">' + esc(SHORT[t.id] || t.label) + '</span>';
    b.onclick = function () {
      st.tier = t.id; saveSt();
      groups.forEach(function (g) { g.pre = {}; });
      renderTop(); render();
    };
    box.appendChild(b);
  });
}

function paintInst(g, i) {
  var it = g.insts[i], mx = maxHp(g), k = g.gi + '#' + i;
  var taken = Math.min(st.taken[k] || 0, mx), hp = mx - taken, pct = Math.min(100, hp / mx * 100), over = hp > mx;
  it.hp.textContent = hp + ' / ' + mx;
  it.hp.style.color = over ? '#1f5fa8' : '';
  it.fill.style.width = pct + '%';
  it.fill.style.background = over ? '#2a6fb0' : pct > 50 ? '#2e8b3a' : pct > 25 ? '#d4a017' : '#b22222';
  it.row.classList.toggle('down', hp === 0);
  var iv = st.init[k];
  it.init.textContent = iv === undefined ? 'Init' : 'Init ' + iv;
  it.init.classList.toggle('set', iv !== undefined);
}
/* net < 0 damages, net > 0 heals (may go above max for temp HP) */
function applyDelta(g, i, net) {
  var k = g.gi + '#' + i, mx = maxHp(g);
  st.taken[k] = Math.min(mx, (st.taken[k] || 0) - net);
  paintInst(g, i); saveSt();
}
/* "-16" or "16" = damage, "+20" = heal, "-5+2" = net */
function parseDelta(s) {
  s = String(s || '').replace(/\s+/g, '');
  if (!s || !/^[+-]?\d+([+-]\d+)*$/.test(s)) return null;
  var terms = s.match(/[+-]?\d+/g), net = 0;
  terms.forEach(function (t, idx) {
    var n = parseInt(t.replace('+', ''), 10);
    net += (idx === 0 && !/^[+-]/.test(t)) ? -Math.abs(n) : n;
  });
  return net;
}
function rollInit(g, i) {
  var c = g.c, b = (c.init !== undefined && c.init !== null) ? c.init : Math.floor(((c.abilities.dex || 10) - 10) / 2);
  var r = d(20), tot = r + b;
  st.init[g.gi + '#' + i] = tot; paintInst(g, i); saveSt();
  return { tot: tot, r: r, b: b };
}

var LAYOUT = {
  1: { polys: ['0,0 44,0 44,44 0,44'], labels: [[22, 23]] },
  2: { polys: ['0,0 44,0 0,44', '44,0 44,44 0,44'], labels: [[14, 14], [30, 30]] },
  3: { polys: ['0,0 44,0 22,22 0,44', '44,0 44,44 22,22', '44,44 0,44 22,22'], labels: [[14, 14], [35, 22], [22, 35]] },
  4: { polys: ['0,0 44,0 22,22', '44,0 44,44 22,22', '44,44 0,44 22,22', '0,44 0,0 22,22'], labels: [[22, 11], [34, 22], [22, 34], [10, 22]] }
};
function chipSvg(parts) {
  var NS = 'http://www.w3.org/2000/svg', n = Math.min(parts.length, 4), L = LAYOUT[n];
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 44 44'); svg.setAttribute('width', '46'); svg.setAttribute('height', '46');
  function mk(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  for (var i = 0; i < n; i++) {
    svg.appendChild(mk('polygon', { points: L.polys[i], fill: tcol(parts[i].type), stroke: '#fff', 'stroke-width': 1.5 }));
    var tx = mk('text', { x: L.labels[i][0], y: L.labels[i][1], 'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-size': n === 1 ? 17 : n === 2 ? 13 : 11, 'font-weight': 'bold', fill: '#222' });
    tx.textContent = parts[i].amt; svg.appendChild(tx);
  }
  svg.appendChild(mk('rect', { x: 0.75, y: 0.75, width: 42.5, height: 42.5, fill: 'none', stroke: '#9a8f73', 'stroke-width': 1.5 }));
  return svg;
}
function paintPre(g, ai, box) {
  box.innerHTML = '';
  (g.pre[ai] || []).forEach(function (p) {
    var chip = el('div', 'chip' + (p.used ? ' used' : ''));
    chip.title = breakdown(p.r) + (p.r.parts.length > 1 ? ' = ' + p.r.total : '');
    chip.appendChild(chipSvg(p.r.parts));
    if (p.r.parts.length > 1) chip.appendChild(el('span', 'cap', '= ' + p.r.total));
    chip.onclick = function () { p.used = !p.used; paintPre(g, ai, box); };
    box.appendChild(chip);
  });
}

function buildGroup(g) {
  var box = el('div', 'grp');
  if (g.err) {
    box.appendChild(el('b', '', g.key));
    var em = el('div', 'sm', g.err + '. '), ea = el('a', '', 'Setup page'); ea.href = 'setup.html';
    em.appendChild(ea); em.appendChild(document.createTextNode(' can paste its data.'));
    box.appendChild(em); return box;
  }
  if (!g.c) { box.appendChild(el('b', '', g.key)); box.appendChild(el('div', 'sm', 'Loading...')); return box; }
  var c = g.c, t = T(), KEYS = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
  function mod(k) { return Math.floor(((c.abilities[k] || 10) - 10) / 2); }
  function isProf(k) { return (c.saves[k] || 0) - mod(k) >= 1; }

  var gh = el('div', 'gh');
  gh.appendChild(el('b', '', c.name + (g.n > 1 ? ' x' + g.n : '')));
  gh.appendChild(el('span', 'ac', 'AC ' + (c.ac + t.ac) + (c.speed ? ' · ' + c.speed : '')));
  box.appendChild(gh);

  var sv = el('div', 'sv');
  if (t.save) sv.title = 'Tier bonus of ' + sgn(t.save) + ' applied to saves';
  KEYS.forEach(function (k) { sv.appendChild(el('span', isProf(k) ? 'ps' : '', k.toUpperCase() + ' ' + sgn((c.saves[k] || 0) + t.save))); });
  box.appendChild(sv);

  var prof = ['Prof ' + sgn(c.pb || 2)];
  var ps = KEYS.filter(isProf).map(function (k) { return k.toUpperCase(); });
  if (ps.length) prof.push(ps.join(', ') + ' saves');
  var sk = (c.skills || []).map(function (s) { return s.name + ' ' + sgn(s.bonus); });
  if (sk.length) prof.push(sk.join(', '));
  box.appendChild(el('div', 'sm', prof.join(' · ')));
  var more = [c.senses, c.defenses].filter(Boolean);
  if (more.length) box.appendChild(el('div', 'sm', more.join(' · ')));

  var rest = [], legFeat = [];
  c.features.forEach(function (f) {
    if (/^multiattack/i.test(f.name)) { var m = el('div', 'ma'); m.innerHTML = '<b>' + esc(f.name) + '</b> ' + esc(f.desc); box.appendChild(m); }
    else if (!f.legendary && /spellcasting/i.test(f.name)) { var sp = el('div', 'ma'); sp.innerHTML = '<b>' + esc(f.name) + '</b> ' + bumpDC(f.desc); box.appendChild(sp); }
    else if (f.legendary) legFeat.push(f);
    else rest.push(f);
  });

  function attackRow(a, ai, parent) {
    var row = el('div', 'atk');
    var an = el('div', 'an');
    an.appendChild(el('b', '', a.name + '  ' + (a.kind === 'save' ? 'DC ' + (a.dc + t.dc) + ' ' + a.ability : sgn(a.bonus + t.hit))));
    var lg = el('span', 'sm');
    partTypes(a).forEach(function (ty) {
      var sw = el('i', 'tg'); sw.style.background = tcol(ty); lg.appendChild(sw); lg.appendChild(document.createTextNode(ty + ' '));
    });
    if (a.note) lg.appendChild(document.createTextNode('· ' + a.note));
    an.appendChild(lg);
    row.appendChild(an);
    var pq = el('div', 'pq');
    var bd = el('button', 'dm', a.dmg + (t.dmg !== 100 ? ' x' + t.dmg / 100 : ''));
    bd.onclick = function () { var r = rollParts(a); say(c.name + ' ' + a.name, 'damage', r.total, (r.parts.length > 1 ? esc(breakdown(r)) + '<br>' : '') + esc(r.text)); };
    row.appendChild(bd);
    var bp = el('button', '', 'Pre x5');
    bp.onclick = function () {
      var q = g.pre[ai] = g.pre[ai] || [];
      for (var i = 0; i < 5; i++) q.push({ r: rollParts(a), used: false });
      paintPre(g, ai, pq);
    };
    row.appendChild(bp);
    row.appendChild(pq); paintPre(g, ai, pq);
    parent.appendChild(row);
  }

  function chipRow(list, parent, tags) {
    var TAG = { 'Bonus action': 'B', 'Reaction': 'R', 'Lair action': 'LA', 'Action': 'A' };
    var fch = el('div', 'fch'), fd = el('div', 'fdesc'), openF = null;
    list.forEach(function (f) {
      var chip = el('span', 'fchip');
      chip.innerHTML = esc(f.name) + (tags && TAG[f.kind] ? '<i>' + TAG[f.kind] + '</i>' : '');
      chip.onclick = function () {
        if (openF === chip) { fd.classList.remove('open'); chip.classList.remove('on'); openF = null; return; }
        if (openF) openF.classList.remove('on');
        openF = chip; chip.classList.add('on');
        fd.innerHTML = '<b>' + esc(f.name) + '</b> <span class="sm">' + esc(f.kind || '') + '</span><br>' + bumpDC(f.desc);
        fd.classList.add('open');
      };
      fch.appendChild(chip);
    });
    parent.appendChild(fch); parent.appendChild(fd);
  }

  c.attacks.forEach(function (a, ai) { if (!a.legendary) attackRow(a, ai, box); });

  var legList = [];
  c.attacks.forEach(function (a, ai) { if (a.legendary) legList.push({ order: a.order || 0, i: legList.length, a: a, ai: ai }); });
  legFeat.forEach(function (f) { legList.push({ order: f.order || 0, i: legList.length, f: f }); });
  legList.sort(function (x, y) { return x.order - y.order || x.i - y.i; });
  if (c.legendary && legList.length) {
    var leg = el('div', 'leg'), lu = c.legendary.uses;
    leg.appendChild(el('div', 'lh', 'Legendary actions - ' + (lu !== null && lu !== undefined ? lu : 3) + (c.legendary.lair ? ' (' + c.legendary.lair + ' in lair)' : '')));
    legList.forEach(function (x) {
      if (x.a) attackRow(x.a, x.ai, leg);
      else { var r = el('div', 'lf'); r.innerHTML = '<b>' + esc(x.f.name) + '</b> ' + bumpDC(x.f.desc); leg.appendChild(r); }
    });
    box.appendChild(leg);
  }

  if (rest.length) chipRow(rest, box, true);

  g.insts = [];
  for (var i = 0; i < g.n; i++) (function (i) {
    var row = el('div', 'inst');
    var fill = el('div', 'fill'); row.appendChild(fill);
    if (g.n > 1) row.appendChild(el('span', 'nm', '#' + (i + 1)));
    var ib = el('button', 'ib', 'Init'); ib.onclick = function () {
      var r = rollInit(g, i); say(c.name + (g.n > 1 ? ' ' + (i + 1) : ''), 'initiative', r.tot, 'd20=' + r.r + sgn(r.b));
    };
    row.appendChild(ib);
    var hpv = el('span', 'hpv'); row.appendChild(hpv);
    var inp = el('input'); inp.type = 'text'; inp.setAttribute('inputmode', 'text'); inp.setAttribute('enterkeyhint', 'done');
    inp.placeholder = '-16 / +20'; inp.autocomplete = 'off'; inp.setAttribute('autocapitalize', 'off');
    function commit() {
      if (!inp.value.trim()) return;
      var net = parseDelta(inp.value);
      if (net === null || net === 0) { inp.style.borderColor = '#b22222'; return; }
      inp.style.borderColor = ''; applyDelta(g, i, net); inp.value = '';
    }
    inp.onkeydown = function (e) { if (e.key === 'Enter') { commit(); inp.blur(); } };
    inp.onchange = commit;
    row.appendChild(inp);
    box.appendChild(row);
    g.insts.push({ row: row, fill: fill, hp: hpv, init: ib });
    paintInst(g, i);
  })(i);
  return box;
}

function render() {
  var box = $('groups'); box.innerHTML = '';
  groups.forEach(function (g) { box.appendChild(buildGroup(g)); });
}

/* ---------- wiring ---------- */
$('last').onclick = function () { $('logPanel').classList.toggle('open'); };
$('btnInitAll').onclick = function () {
  var out = [];
  groups.forEach(function (g) {
    if (!g.c) return;
    for (var i = 0; i < g.n; i++) { var r = rollInit(g, i); out.push((g.n > 1 ? g.c.name + ' ' + (i + 1) : g.c.name) + ' ' + r.tot); }
  });
  if (out.length) say('Initiative', '', '', out.join(' | '));
};
var resetTimer = null;
$('lnkReset').onclick = function (e) {
  e.preventDefault();
  var link = this;
  if (!resetTimer) {
    link.textContent = 'Tap again to reset all HP and initiative';
    resetTimer = setTimeout(function () { resetTimer = null; link.textContent = 'Reset HP and init'; }, 4000);
    return;
  }
  clearTimeout(resetTimer); resetTimer = null; link.textContent = 'Reset HP and init';
  st.taken = {}; st.init = {}; saveSt();
  groups.forEach(function (g) { g.insts.forEach(function (x, i) { paintInst(g, i); }); });
};

/* ---------- init ---------- */
var baked = (typeof ENCOUNTER === 'string' && ENCOUNTER) ? ENCOUNTER : '';
start(urlEncounter() || baked || '');
})();
</script>
</body>
